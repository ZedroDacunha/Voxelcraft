<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voxelcraft — animação de nado</title>
<style>body{margin:0;background:#14262b;color:#eef6f5;font:16px system-ui;text-align:center}main{max-width:800px;margin:auto;padding:20px}h1{font-size:1.5rem}p{color:#bdd3d1}canvas{width:100%;height:min(60vh,500px);display:block;border-radius:12px;touch-action:none}button{background:#426966;color:white;border:1px solid #85a9a4;border-radius:5px;padding:10px 16px;font:inherit;margin:10px 4px}img{width:100px;max-width:100%}</style></head>
<body><main><h1>Personagem nadando</h1><p>Prévia do modelo real: arraste para girar e alterne entre nadar, parar e sair da água.</p>
<img alt="Esquema da pose horizontal de nado" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 35'%3E%3Cpath fill='%23455c3a' d='M28 8h42v18H28z'/%3E%3Cpath fill='%23b77c5f' d='M70 6h22v22H70z'/%3E%3Cpath fill='%23514b43' d='M4 9h24v7H4zm0 10h24v7H4z'/%3E%3Cpath fill='%23b4a582' d='M37 2h27v5H37zm0 26h27v5H37z'/%3E%3C/svg%3E">
<canvas id="view"></canvas><button id="swim">Nadar</button><button id="idle">Parar na água</button><button id="land">Sair da água</button></main>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import {createPlayerModel} from '../player-model.js';
import {createSwimState,advanceSwim,swimPose} from '../player-swim-animation.js';
const canvas=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x315b66);const camera=new THREE.PerspectiveCamera(32,1,.1,30);camera.position.set(0,1.3,5.8);camera.lookAt(0,.9,0);
scene.add(new THREE.HemisphereLight(0xe7ffff,0x304751,2));const light=new THREE.DirectionalLight(0xffffff,1.4);light.position.set(3,5,4);scene.add(light);
const model=createPlayerModel(THREE),rotation=new THREE.Group();scene.add(rotation);rotation.add(model.root);rotation.rotation.y=-1.1;
const water=new THREE.Mesh(new THREE.PlaneGeometry(5,5),new THREE.MeshBasicMaterial({color:0x338aa0,transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false}));water.rotation.x=-Math.PI/2;water.position.y=.85;scene.add(water);
const state=createSwimState();let mode='swim', last=performance.now();document.querySelector('#swim').onclick=()=>mode='swim';document.querySelector('#idle').onclick=()=>mode='idle';document.querySelector('#land').onclick=()=>mode='land';
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();let lastX=null;canvas.addEventListener('pointerdown',e=>{lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(lastX===null)return;rotation.rotation.y+=(e.clientX-lastX)*.01;lastX=e.clientX});canvas.addEventListener('pointerup',()=>lastX=null);canvas.addEventListener('pointercancel',()=>lastX=null);
renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;advanceSwim(state,{dt,feetInWater:mode!=='land',onGround:false,gaitAmplitude:mode==='swim'?.7:0});const p=swimPose(state);model.root.position.set(p.offsetX,p.offsetY,p.offsetZ);model.root.rotation.set(p.tilt,0,0,'YXZ');model.leftLeg.rotation.x=p.leftLeg;model.rightLeg.rotation.x=p.rightLeg;model.leftArm.rotation.x=p.leftArm;model.rightArm.rotation.x=p.rightArm;water.visible=mode!=='land';renderer.render(scene,camera)});
</script></body></html>
