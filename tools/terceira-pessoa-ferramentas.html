import * as THREE from '../vendor/three/three.module.js';
import {createPlayerModel} from '../player-model.js';
import {createPlayerHeldItem} from '../player-held-item.js';
import {createPickaxeSpritePixels,createAxeSpritePixels,createShovelSpritePixels,createShearsSpritePixels} from '../world-tool-textures.js';
const canvas=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x273a2c);const camera=new THREE.PerspectiveCamera(32,1,.1,30);camera.position.set(0,1.15,5.3);camera.lookAt(0,.9,0);

const model=createPlayerModel(THREE);scene.add(model.root);model.root.rotation.y=-.5;const held=createPlayerHeldItem(THREE,model.rightArm);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(.9,.95,.08,32),new THREE.MeshLambertMaterial({color:0x536d4c}));floor.position.y=-.04;scene.add(floor);
