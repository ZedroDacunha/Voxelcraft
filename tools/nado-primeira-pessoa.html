<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nado em primeira pessoa</title><style>body{margin:0;background:#13272c;color:#eef6f5;text-align:center;font:16px system-ui}main{max-width:800px;margin:auto;padding:20px}canvas{width:100%;height:min(60vh,500px);border-radius:10px;display:block}button{background:#426966;color:white;border:1px solid #85a9a4;border-radius:5px;padding:10px 16px;font:inherit;margin:10px 4px}p{color:#bdd3d1}img{width:100px}</style></head><body><main><h1>Nado em primeira pessoa</h1><p>Prévia ilustrativa do braço e da câmera. Use os botões para nadar e parar; o jogo completo está na raiz do servidor.</p>
<img alt="Esquema de braçada" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 35'%3E%3Cpath fill='%2338869c' d='M0 16q10-8 20 0t20 0 20 0 20 0 20 0v19H0z'/%3E%3Cpath fill='%23b77c5f' d='M32 6h40v9H32z'/%3E%3Cpath fill='%23536b47' d='M15 6h20v9H15z'/%3E%3C/svg%3E">
<canvas id="view"></canvas><button id="swim">Nadar</button><button id="idle">Parar</button></main><script type="module">
import * as THREE from '../vendor/three/three.module.js';
import {createTextureTools} from '../world-textures.js';
import {createSwimState,advanceSwim,swimFirstPersonPose} from '../player-swim-animation.js';
const canvas=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.autoClear=false;renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x315c70);scene.add(new THREE.HemisphereLight(0xffffff,0x486070,2));
const camera=new THREE.PerspectiveCamera(70,1,.01,30);camera.position.set(0,1.5,4);camera.lookAt(0,1.5,0);
for(let x=-3;x<=3;x++)for(let z=-4;z<=1;z++){const box=new THREE.Mesh(new THREE.BoxGeometry(.96,.96,.96),new THREE.MeshLambertMaterial({color:(x+z)%2?0x7d8267:0x677968}));box.position.set(x,-.8,z);scene.add(box)}
const handScene=new THREE.Scene(),handCamera=new THREE.PerspectiveCamera(70,1,.01,5),pivot=new THREE.Group();handScene.add(handCamera);handCamera.add(pivot);handScene.add(new THREE.AmbientLight(0xffffff,.75));const light=new THREE.DirectionalLight(0xffffff,.5);light.position.set(.5,1,.8);handScene.add(light);
const tex=createTextureTools(THREE);const sleeve=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,.40),new THREE.MeshLambertMaterial({map:tex.createNoiseTexture([70,110,190],11)}));sleeve.position.z=-.20;pivot.add(sleeve);const hand=new THREE.Mesh(new THREE.BoxGeometry(.13,.13,.20),new THREE.MeshLambertMaterial({map:tex.createNoiseTexture([214,166,125],12,8)}));hand.position.z=-.50;pivot.add(hand);
let active=true,last=performance.now();const state=createSwimState();document.querySelector('#swim').onclick=()=>active=true;document.querySelector('#idle').onclick=()=>active=false;
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=handCamera.aspect=w/h;camera.updateProjectionMatrix();handCamera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;advanceSwim(state,{dt,feetInWater:true,onGround:false,gaitAmplitude:active?.7:0});const p=swimFirstPersonPose(state);camera.position.y=1.5+p.cameraY;pivot.position.set(.42+p.handX,-.5+p.handY,-.25+p.handZ);pivot.rotation.set(.35+p.handPitch,.25,0);renderer.clear();renderer.render(scene,camera);renderer.clearDepth();renderer.render(handScene,handCamera)});
</script></body></html>
