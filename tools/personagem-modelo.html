<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voxelcraft — corpo do aventureiro</title>
<style>body{margin:0;background:#19241e;color:#eef3e9;font:16px system-ui;text-align:center}main{max-width:800px;margin:auto;padding:20px}h1{font-size:1.5rem}p{color:#b9c9b5}canvas{width:100%;height:min(65vh,550px);display:block;border-radius:12px;touch-action:none;background:#273a2c}button{background:#526b49;color:white;border:1px solid #879e78;border-radius:5px;padding:10px 16px;font:inherit;margin:10px 4px}</style></head>
<body><main><h1>Corpo do aventureiro</h1><p>Primeira etapa: modelo 3D. Arraste para girar; use os botões para trocar a vista.</p><canvas id="view"></canvas><button data-angle="0">Frente</button><button data-angle="3.141592653589793">Costas</button><button data-angle="1.5707963267948966">Lado</button></main>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import { createPlayerModel } from '../player-model.js';
const canvas = document.querySelector('#view');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x273a2c);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 30); camera.position.set(0, 1.15, 5.3); camera.lookAt(0, 0.9, 0);
scene.add(new THREE.HemisphereLight(0xeaf1da, 0x46503a, 2));
const light = new THREE.DirectionalLight(0xffffff, 1.6); light.position.set(3, 5, 4); scene.add(light);
const model = createPlayerModel(THREE); scene.add(model.root); model.root.rotation.y = -0.35;
const floor = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.95, 0.08, 32), new THREE.MeshLambertMaterial({color:0x536d4c})); floor.position.y=-0.04; scene.add(floor);
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();} window.addEventListener('resize',resize); resize();
let lastX = null; canvas.addEventListener('pointerdown',e=>{lastX=e.clientX;canvas.setPointerCapture(e.pointerId);}); canvas.addEventListener('pointermove',e=>{if(lastX===null)return;model.root.rotation.y+=(e.clientX-lastX)*0.01;lastX=e.clientX;}); canvas.addEventListener('pointerup',()=>{lastX=null;}); canvas.addEventListener('pointercancel',()=>{lastX=null;});
document.querySelectorAll('button[data-angle]').forEach(button=>button.addEventListener('click',()=>{model.root.rotation.y=Number(button.dataset.angle);}));
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
