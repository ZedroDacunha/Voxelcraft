name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Testes e validação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O projeto não tem dependências: nada de `npm install`.
      - name: Testes
        run: npm test

      - name: Sintaxe dos módulos e importmap
        run: npm run check

  dupla:
    name: Partida online em dois navegadores
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar convite, avatares, blocos, chat e saída
        run: |
          python -m pip install playwright==1.56.0
          node tools/serve.mjs &
          CHROME_BIN="$(command -v google-chrome)" python tools/test-online-browser.py
