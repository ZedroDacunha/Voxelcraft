name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Testes e validação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O projeto não tem dependências: nada de `npm install`.
      - name: Testes
        run: npm test

      - name: Sintaxe dos módulos e importmap
        run: npm run check
