# Publica via Actions apenas quando essa for a fonte escolhida em Settings → Pages.
# Se a fonte for uma branch, o próprio GitHub publica e este fluxo não compete.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fonte:
    name: Verificar fonte do Pages
    runs-on: ubuntu-latest
    outputs:
      tipo: ${{ steps.source.outputs.tipo }}
    steps:
      - name: Consultar configuração do Pages
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tipo="$(gh api "repos/$GH_REPO/pages" --jq '.build_type')"
          case "$tipo" in
            legacy|workflow) ;;
            *) echo "Fonte do Pages inesperada: $tipo" >&2; exit 1 ;;
          esac
          echo "tipo=$tipo" >> "$GITHUB_OUTPUT"
          if [ "$tipo" = legacy ]; then
            echo 'Pages publica pela branch configurada; deploy por Actions não será executado.'
          fi

  publicar:
    name: Publicar no Pages
    needs: fonte
    if: needs.fonte.outputs.tipo == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Testes, ferramentas e documentação não fazem parte do site.
      - name: Preparar o site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' --exclude '.github' \
            --exclude 'tests' --exclude 'tools' \
            --exclude 'package.json' --exclude '*.md' \
            ./ _site/
          ls -A _site | head -20

      - name: Empacotar
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # A API pode demorar para listar o artefato recém-criado. Se a primeira
      # tentativa falhar, aguardar e tentar novamente; a segunda falha o job.
      - name: Publicar
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Aguardar antes da nova tentativa
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - name: Publicar novamente
        if: steps.deploy.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v4
